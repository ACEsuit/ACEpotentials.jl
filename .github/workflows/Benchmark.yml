name: Benchmark
# Performance-regression guard for force/energy evaluation.
#
# Runs the PkgBenchmark suite in benchmark/benchmarks.jl and uses BenchmarkCI to
# judge the PR head against its merge base ON THE SAME RUNNER. Comparing both
# revisions on identical hardware cancels most runner noise, which is what makes
# GitHub-runner timings trustworthy.
#
# Non-blocking on purpose (continue-on-error) until the threshold is calibrated
# on real PRs; promote to a required check once the signal is stable.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: Force/energy benchmark (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true   # keep non-blocking until calibrated
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: '1'   # classic path is threaded via Folds; pin for stable ratios
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # BenchmarkCI needs history to find the merge base
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          arch: x64
      - run: |
          using Pkg
          Pkg.pkg"registry add https://github.com/ACEsuit/ACEregistry"
        shell: bash -c "julia --color=yes {0}"
      - uses: julia-actions/cache@v2
      - name: Install BenchmarkCI
        run: julia --color=yes -e 'using Pkg; Pkg.add("BenchmarkCI")'
      - name: Run judgement (PR head vs merge base)
        run: julia --color=yes -e 'using BenchmarkCI; BenchmarkCI.judge()'
      - name: Display results
        run: julia --color=yes -e 'using BenchmarkCI; BenchmarkCI.displayjudgement()'
