name: Export CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'export/**'
      - '.github/workflows/export-ci.yml'
  pull_request:
    paths:
      - 'export/**'
      - '.github/workflows/export-ci.yml'

env:
  JULIA_NUM_THREADS: 2

jobs:
  build-lammps:
    runs-on: ubuntu-latest
    outputs:
      lammps-version: ${{ steps.lammps-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libfftw3-dev \
            libopenmpi-dev \
            mpi-default-bin \
            mpi-default-dev

      - name: Get LAMMPS version hash
        id: lammps-version
        run: |
          LAMMPS_VERSION=$(git ls-remote https://github.com/lammps/lammps.git refs/heads/stable | awk '{print $1}' | cut -c1-8)
          echo "version=$LAMMPS_VERSION" >> $GITHUB_OUTPUT
          echo "LAMMPS_VERSION=$LAMMPS_VERSION" >> $GITHUB_ENV

      - name: Cache LAMMPS
        id: lammps-cache
        uses: actions/cache@v4
        with:
          path: lammps
          key: ${{ runner.os }}-lammps-${{ steps.lammps-version.outputs.version }}-plugin-v1

      - name: Clone LAMMPS
        if: steps.lammps-cache.outputs.cache-hit != 'true'
        run: |
          git clone -b stable --depth 1 https://github.com/lammps/lammps.git

      - name: Build LAMMPS
        if: steps.lammps-cache.outputs.cache-hit != 'true'
        run: |
          cd lammps
          mkdir -p build && cd build
          cmake ../cmake \
            -D PKG_PLUGIN=on \
            -D BUILD_SHARED_LIBS=on \
            -D BUILD_MPI=on \
            -D BUILD_OMP=on \
            -D CMAKE_BUILD_TYPE=Release
          cmake --build . -j $(nproc)

      - name: Upload LAMMPS artifact
        uses: actions/upload-artifact@v4
        with:
          name: lammps-build
          path: |
            lammps/build/lmp
            lammps/build/liblammps.so*
            lammps/src/*.h
            lammps/src/STUBS/
            lammps/src/fmt/
            lammps/src/nlohmann/
          retention-days: 1

  test-etace-export:
    name: ETACE Export Tests
    runs-on: ubuntu-latest
    outputs:
      library-built: ${{ steps.compile.outputs.library-built }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
          key: ${{ runner.os }}-julia-export-${{ hashFiles('export/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-export-

      - name: Install Julia dependencies
        run: |
          julia --project=export -e '
            using Pkg
            Pkg.instantiate()
            Pkg.precompile()
          '

      # `pair` is selected here even though a hosted runner cannot satisfy it: selecting it is
      # what makes the group report a status at all.  ACE_REQUIRE_GROUPS lists the groups a
      # hosted runner CAN run, and the suite fails if any of them did not execute; `pair` is
      # then dealt with explicitly by the step after this one.
      #
      # `hermite` pulls in test_hermite_spline_export.jl AND test_hermite_accuracy.jl
      # (:hermite_spline vs the SPLINIFIED model at 1e-8, :polynomial vs the FITTED model at
      # 1e-12); `multispecies` runs both radial-basis modes of test_multispecies.jl.
      - name: Run ETACE export tests (polynomial, hermite, multispecies, pair)
        env:
          ACE_REQUIRE_GROUPS: etace,hermite,hermite_accuracy,multispecies
        run: |
          set -o pipefail
          julia --project=export export/test/runtests.jl etace hermite multispecies pair \
            2>&1 | tee export-tests.log

      # K3: a gate that did not execute must never be reported as a gate that passed.
      #
      # EVERY fixture-guarded group is checked here, not just `pair`.  Both of them compare an
      # exported model against the FITTED Cantor model and need
      # verify_cantor/cantor_v010_params.jld2 plus the held-out geometries, which are
      # host-local data that is not in this repository:
      #
      #   pair            test_pair_export.jl     -- the plan's only pair-parity gate
      #   hermite_cantor  test_hermite_cantor.jl  -- Hermite vs the SPLINIFIED stack at 1e-12
      #
      # A GitHub-hosted runner cannot run either, so this step says so in the job summary and
      # as a workflow annotation rather than letting a green tick imply otherwise.  If a
      # future group is fixture-guarded, add its name to FIXTURE_GATES below -- forgetting to
      # is how hermite_cantor went uncovered in the first place.
      #
      # Set the repository variable ACE_PAIR_GATE_REQUIRED to `true` on a runner that does
      # have the fixture (see the pair-parity job below) and a missing gate becomes a hard
      # failure instead of an annotation.
      - name: Check the fixture-guarded gates executed
        if: always()
        env:
          PAIR_GATE_REQUIRED: ${{ vars.ACE_PAIR_GATE_REQUIRED || 'false' }}
          FIXTURE_GATES: "pair hermite_cantor"
        run: |
          missing=""
          for g in $FIXTURE_GATES; do
            status=$(grep -o "ACE_GROUP_STATUS $g=[a-z]*" export-tests.log | tail -1 | cut -d= -f2)
            echo "$g group status: ${status:-absent}"
            if [ "$status" = "ran" ]; then
              echo "- fixture-guarded gate \`$g\`: **executed**" >> $GITHUB_STEP_SUMMARY
            else
              missing="$missing $g"
            fi
          done
          [ -z "$missing" ] && exit 0
          {
            echo "### :warning: fixture-guarded gates did NOT run on this runner:$missing"
            echo ""
            echo "\`test_pair_export.jl\` (group \`pair\`) is the only check in this repository"
            echo "that compares an exported model *including its pair term* against the fitted"
            echo "Cantor model; \`test_hermite_cantor.jl\` (group \`hermite_cantor\`) is the only"
            echo "one that gates a Hermite export against the splinified Cantor stack at 1e-12."
            echo "Both need \`verify_cantor/cantor_v010_params.jld2\` and the held-out geometries,"
            echo "neither of which is in the repository, so neither can run on a GitHub-hosted"
            echo "runner. **A green tick on this job does not mean those gates were checked.**"
          } >> $GITHUB_STEP_SUMMARY
          echo "::warning title=fixture-guarded gates skipped::$missing did not run (Cantor fixture absent); those gates were NOT checked by this job"
          if [ "$PAIR_GATE_REQUIRED" = "true" ]; then
            echo "::error title=fixture-guarded gates skipped::ACE_PAIR_GATE_REQUIRED=true but$missing did not run"
            exit 1
          fi

      - name: Compile ETACE model to shared library
        id: compile
        run: |
          # Use test_etace_model.jl which has all C interface functions (energy, forces, virial)
          # Other models like test_etace_energy.jl only have energy functions
          cd export/test/build
          MODEL_FILE="test_etace_model.jl"
          if [ ! -f "$MODEL_FILE" ]; then
            echo "No exported model found, creating one..."
            julia --project=../../ -e '
              include("../../src/export_ace_model.jl")
              using ACEpotentials
              using ACEpotentials.Models
              using ACEpotentials.ETModels
              using Lux, LuxCore, Random

              # Create minimal ETACE model for testing
              elements = (:Si,)
              rcut = 5.5
              rin0cuts = Models._default_rin0cuts(elements)
              rin0cuts = (x -> (rin = x.rin, r0 = x.r0, rcut = rcut)).(rin0cuts)

              # The library model MUST carry the pair term and E0: every gate that goes
              # through libace_test.so (LAMMPS at 1e-10, the Python C API at 1e-12, the
              # two-rank run, test_python.jl, the ase-ace jobs) evaluates this model, and a
              # bare ETACEPotential would turn all of them into many-body-only checks.
              # Mirrors setup_stacked_model in export/test/test_etace_export.jl.
              ace_model = Models.ace_model(;
                  elements = elements, order = 2, Ytype = :solid,
                  level = Models.TotalDegree(), max_level = 6, maxl = 2,
                  pair_maxn = 6, rin0cuts = rin0cuts,
                  init_WB = :glorot_normal, init_Wpair = :glorot_normal,
                  pair_learnable = true, E0s = Dict(:Si => -5.0)
              )
              ps, st = Lux.setup(Random.MersenneTwister(1234), ace_model)

              stacked = ETModels.convert2et_full(ace_model, ps, st;
                                                 rng = Random.MersenneTwister(1234))
              export_ace_model(stacked, "test_etace_model.jl"; for_library=true)
            '
            MODEL_FILE="test_etace_model.jl"
          fi
          echo "Compiling $MODEL_FILE using JuliaC.jl..."

          # Use JuliaC.jl package for compilation (more portable than bundled juliac.jl)
          # JuliaC requires: ImageRecipe -> LinkRecipe -> compile_products -> link_products
          julia --startup-file=no --project=../../ -e "
            using Pkg
            Pkg.add(\"JuliaC\")
            using JuliaC

            # Create image recipe for shared library with ccallable exports
            # Use cpu_target='generic' for portability across different CI runner CPUs
            img = ImageRecipe(;
                file=\"$MODEL_FILE\",
                output_type=\"sharedlib\",
                trim_mode=\"safe\",
                add_ccallables=true,
                cpu_target=\"generic\",
                verbose=true
            )

            # Create link recipe to produce the final .so file
            link = LinkRecipe(;
                image_recipe=img,
                outname=\"libace_test.so\"
            )

            # Compile and link
            compile_products(img)
            link_products(link)
          "

          if [ ! -f "libace_test.so" ]; then
            echo "::error::Failed to compile shared library"
            exit 1
          fi

          ls -la libace_test.so
          echo "library-built=true" >> $GITHUB_OUTPUT

      # test_lammps.jl's own 1e-10 gate (`load_exported(model_file)`) reads the generated
      # `.jl` source, not just the compiled `.so` -- it needs both PAIR_C/E0_1 for the pair
      # assertions and `site_energy_forces_virial` for `exported_efv`'s reference value.  A
      # download-artifact of `ace-library` that carried only the `.so` made that gate ERROR
      # on every hosted runner (the source file was simply absent from `export/test/build`),
      # so the 1e-10 gate had never actually executed on GitHub-hosted CI.
      - name: Upload compiled library
        if: steps.compile.outputs.library-built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ace-library
          path: |
            export/test/build/libace_test.so
            export/test/build/test_etace_model.jl
          retention-days: 1

  test-python:
    runs-on: ubuntu-latest
    needs: test-etace-export
    if: needs.test-etace-export.outputs.library-built == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled library
        uses: actions/download-artifact@v4
        with:
          name: ace-library
          path: export/test/build

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: |
          cd export
          uv sync
          # Install ase-ace package into the venv for Python calculator tests
          uv pip install -e ase-ace

      - name: Cache Julia packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
          key: ${{ runner.os }}-julia-export-${{ hashFiles('export/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-export-

      - name: Install Julia dependencies
        run: |
          julia --project=export -e '
            using Pkg
            Pkg.instantiate()
          '

      # K1 (the GLIBCXX_3.4.30 errors) is fixed inside the runner: test_python.jl builds its
      # LD_LIBRARY_PATH with ace_runtime_env, which adds <julia>/lib/julia as well as
      # <julia>/lib.  Nothing is needed here beyond the venv.
      - name: Run Python tests
        env:
          ACE_REQUIRE_GROUPS: python
        run: |
          export PATH="${{ github.workspace }}/export/.venv/bin:$PATH"
          export VIRTUAL_ENV="${{ github.workspace }}/export/.venv"
          julia --project=export export/test/runtests.jl python

  test-lammps-serial:
    runs-on: ubuntu-latest
    needs: [build-lammps, test-etace-export]
    if: needs.test-etace-export.outputs.library-built == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled library
        uses: actions/download-artifact@v4
        with:
          name: ace-library
          path: export/test/build

      - name: Install MPI (headers and mpirun -- the two-rank step needs both)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev mpi-default-bin

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Download LAMMPS
        uses: actions/download-artifact@v4
        with:
          name: lammps-build
          path: lammps

      - name: Setup LAMMPS
        run: |
          chmod +x lammps/build/lmp
          echo "$GITHUB_WORKSPACE/lammps/build" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/lammps/build:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Cache Julia packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
          key: ${{ runner.os }}-julia-export-${{ hashFiles('export/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-export-

      - name: Install Julia dependencies
        run: |
          julia --project=export -e '
            using Pkg
            Pkg.instantiate()
          '

      # -DBUILD_OMP=OFF until Task 6 introduces the per-thread workspace: the plugin's
      # OpenMP path has no verified serial-vs-threaded parity check yet, and building it
      # here would put an unverified code path under the 1e-10 gate below.  Task 6 switches
      # this ON together with the OMP_NUM_THREADS=4 vs serial comparison at 1e-12.
      - name: Build ACE LAMMPS plugin (OpenMP off until Task 6)
        run: |
          cd export/lammps/plugin
          mkdir -p build && cd build
          cmake ../cmake -DLAMMPS_HEADER_DIR=$GITHUB_WORKSPACE/lammps/src -DBUILD_OMP=OFF
          make -j $(nproc)

      # The 1e-12 library-vs-Julia attribution gate inside the `lammps` group goes through
      # ase / ase-ace.  Without them installed here that gate reported a `@test_skip` while
      # the group as a whole reported `ran`, so ACE_REQUIRE_GROUPS=lammps passed with the
      # attribution check silently absent.  `required_check` now turns that into a FAILURE;
      # this step is what makes it unnecessary to hit it.
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies (needed by the 1e-12 attribution gate)
        run: |
          cd export
          uv sync
          uv pip install -e ase-ace

      # The `lammps` group gates `pair_style ace` against the exported model evaluated in
      # Julia at 1e-10 (energy/atom and forces), the compiled library through the Python C
      # API against the same Julia numbers at 1e-12, and 2 MPI ranks against 1 at 1e-12.
      # ACE_REQUIRE_GROUPS makes a skipped group -- and now a skipped check WITHIN the group
      # -- a failure rather than a warning.
      - name: Run LAMMPS tests (serial, 1e-10 vs Julia)
        env:
          LAMMPS_SRC: ${{ github.workspace }}/lammps/src
          ACE_REQUIRE_GROUPS: lammps
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
        run: |
          export PATH="${{ github.workspace }}/export/.venv/bin:$PATH"
          export VIRTUAL_ENV="${{ github.workspace }}/export/.venv"
          julia --project=export export/test/runtests.jl lammps

      # Run the two-rank comparison a second time, standalone.  The Julia group above already
      # invokes this script; running it again without Julia is what keeps it usable by Task 6
      # (OMP parity) and Task 8, which have no Julia process to call it from.
      - name: Two-rank parity (1 rank vs 2 ranks, 1e-12)
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
        run: |
          # K1: the juliac-compiled library needs the libstdc++ Julia bundles in
          # <julia>/lib/julia, not just libjulia.so in <julia>/lib.
          JL=$(julia -e 'print(joinpath(Sys.BINDIR, ".."))')
          export LD_LIBRARY_PATH="$JL/lib:$JL/lib/julia:$GITHUB_WORKSPACE/export/test/build:$LD_LIBRARY_PATH"
          python3 -m pip install --quiet numpy
          bash export/lammps/test/run_two_ranks.sh \
            --lmp $GITHUB_WORKSPACE/lammps/build/lmp \
            --mpirun "$(command -v mpirun)" \
            --plugin export/lammps/plugin/build/aceplugin.so \
            --lib export/test/build/libace_test.so \
            --workdir $RUNNER_TEMP/two_ranks \
            --tol 1e-12

  test-mpi:
    runs-on: ubuntu-latest
    needs: [build-lammps, test-lammps-serial, test-etace-export]
    if: needs.test-etace-export.outputs.library-built == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled library
        uses: actions/download-artifact@v4
        with:
          name: ace-library
          path: export/test/build

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Install MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev mpi-default-bin

      - name: Download LAMMPS
        uses: actions/download-artifact@v4
        with:
          name: lammps-build
          path: lammps

      - name: Setup LAMMPS
        run: |
          chmod +x lammps/build/lmp
          echo "$GITHUB_WORKSPACE/lammps/build" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/lammps/build:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Cache Julia packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
          key: ${{ runner.os }}-julia-export-${{ hashFiles('export/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-export-

      - name: Install Julia dependencies
        run: |
          julia --project=export -e '
            using Pkg
            Pkg.instantiate()
          '

      # -DBUILD_OMP=OFF until Task 6; see the serial job for why.
      - name: Build ACE LAMMPS plugin (OpenMP off until Task 6)
        run: |
          cd export/lammps/plugin
          mkdir -p build && cd build
          cmake ../cmake -DLAMMPS_HEADER_DIR=$GITHUB_WORKSPACE/lammps/src -DBUILD_OMP=OFF
          make -j $(nproc)

      - name: Run MPI tests
        env:
          LAMMPS_SRC: ${{ github.workspace }}/lammps/src
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
          ACE_REQUIRE_GROUPS: mpi
        run: |
          julia --project=export export/test/runtests.jl mpi

  test-ase-ace-imports:
    name: ase-ace (imports and utils)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ase-ace package
        run: |
          cd export/ase-ace
          pip install -e ".[dev]"

      - name: Run import and utility tests
        run: |
          cd export/ase-ace
          pytest -v tests/test_calculator.py::TestImports tests/test_calculator.py::TestUtilities tests/test_calculator.py::TestCalculatorInit -m "not requires_julia"

  test-ase-ace-library:
    name: ase-ace (library calculator)
    runs-on: ubuntu-latest
    needs: test-etace-export
    if: needs.test-etace-export.outputs.library-built == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled library
        uses: actions/download-artifact@v4
        with:
          name: ace-library
          path: export/test/build

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Julia packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
          key: ${{ runner.os }}-julia-export-${{ hashFiles('export/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-export-

      - name: Install Julia dependencies
        run: |
          julia --project=export -e '
            using Pkg
            Pkg.instantiate()
          '

      - name: Install ase-ace package with library support
        run: |
          cd export/ase-ace
          pip install -e ".[dev,lib]"

      - name: Setup library path
        run: |
          chmod +x ${{ github.workspace }}/export/test/build/libace_test.so || true
          JL=$(dirname $(julia -e 'print(Sys.BINDIR)'))
          # K1: <julia>/lib/julia carries the libstdc++ the compiled library was built against.
          echo "LD_LIBRARY_PATH=$JL/lib:$JL/lib/julia:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Run ase-ace library calculator tests
        env:
          ACE_TEST_LIBRARY: ${{ github.workspace }}/export/test/build/libace_test.so
        run: |
          cd export/ase-ace
          pytest -v tests/test_library_calculator.py

  test-ase-ace-julia:
    name: ase-ace (julia calculator)
    runs-on: ubuntu-latest
    needs: test-etace-export
    if: needs.test-etace-export.outputs.library-built == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled library
        uses: actions/download-artifact@v4
        with:
          name: ace-library
          path: export/test/build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Julia packages (juliapkg)
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/environments/pyjuliapkg
          key: ${{ runner.os }}-juliapkg-${{ hashFiles('export/ase-ace/src/ase_ace/juliapkg.json') }}
          restore-keys: |
            ${{ runner.os }}-juliapkg-

      - name: Install ase-ace package with JuliaCall support
        run: |
          cd export/ase-ace
          pip install -e ".[dev,julia,lib]"

      - name: Create test model
        env:
          JULIA_NUM_THREADS: 2
          PYTHON_JULIACALL_HANDLE_SIGNALS: yes
        working-directory: export/ase-ace
        run: |
          # Create fixtures directory and a FITTED test model using ase_ace module
          # This ensures juliapkg finds the correct juliapkg.json
          python3 -c "
          import os
          os.makedirs('tests/fixtures', exist_ok=True)
          # Import ase_ace to trigger juliapkg resolution with our dependencies
          from ase_ace.julia_calculator import ACEJuliaCalculator
          # Access the Julia runtime to create and fit a test model
          jl = ACEJuliaCalculator._init_julia(2)
          jl.seval('using ACEfit')
          jl.seval('''
          # Load training data and fit model (same as export tests)
          dataset = ACEpotentials.example_dataset(\\\"Si_tiny\\\")
          data = dataset.train

          model = ace1_model(elements=[:Si], order=2, totaldegree=6, rcut=5.5)

          data_keys = (
              energy_key = \\\"dft_energy\\\",
              force_key = \\\"dft_force\\\",
              virial_key = \\\"dft_virial\\\",
          )
          weights = Dict(\\\"default\\\" => Dict(\\\"E\\\" => 30.0, \\\"F\\\" => 1.0, \\\"V\\\" => 1.0))

          ACEpotentials.acefit!(data, model; data_keys..., weights=weights, solver=ACEfit.BLR())
          ACEpotentials.save_model(model, \\\"tests/fixtures/test_model.json\\\")
          ''')
          print('Test model created and fitted successfully')
          "

      - name: Run ase-ace julia calculator tests
        env:
          JULIA_NUM_THREADS: 2
          PYTHON_JULIACALL_HANDLE_SIGNALS: yes
          ACE_TEST_MODEL: ${{ github.workspace }}/export/ase-ace/tests/fixtures/test_model.json
          ACE_TEST_LIBRARY: ${{ github.workspace }}/export/test/build/libace_test.so
        working-directory: export/ase-ace
        run: |
          pytest -v tests/test_julia_calculator.py -x

  # ---------------------------------------------------------------------------------------
  # The pair-parity gate, where it can actually run.
  #
  # `test_pair_export.jl` and `test_hermite_cantor.jl` both check an exported model against
  # the FITTED Cantor model, using `verify_cantor/cantor_v010_params.jld2` and the held-out
  # LAMMPS geometries.  Neither file is in this repository -- they are host-local data -- so
  # these are the only two groups no GitHub-hosted runner can execute.
  #
  # Point the repository variable ACE_PAIR_GATE_RUNNER at a self-hosted runner that has that
  # data and this job runs there with ACE_REQUIRE_GROUPS set, so a missing fixture FAILS
  # rather than warns.  With the variable unset the job does not run at all, and the
  # "Check the pair-parity gate executed" step of the hosted job annotates the gap.
  # ---------------------------------------------------------------------------------------
  pair-parity:
    name: Pair-parity gate (Cantor fixture; self-hosted)
    if: ${{ vars.ACE_PAIR_GATE_RUNNER != '' }}
    runs-on: ${{ vars.ACE_PAIR_GATE_RUNNER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Julia dependencies
        run: |
          julia --project=export -e 'using Pkg; Pkg.instantiate()'

      - name: Run the Cantor-fixture groups (pair + Cantor Hermite)
        env:
          ACE_REQUIRE_GROUPS: pair,hermite_cantor
        run: |
          julia --project=export export/test/runtests.jl pair hermite
