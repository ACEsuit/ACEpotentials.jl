[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ase-ace"
version = "0.1.0"
description = "ASE calculators for ACE potentials (socket and compiled library backends)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ACEsuit contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["ase", "ace", "molecular-dynamics", "machine-learning", "interatomic-potentials"]
dependencies = [
    "ase>=3.22",
    "numpy>=1.20",
]

[project.optional-dependencies]
# ACELibraryCalculator - compiled .so backend
lib = [
    "matscipy>=0.8",
]

# ACEJuliaCalculator - JuliaCall backend
julia = [
    "juliacall>=0.9.20",
    "juliapkg>=0.1.10",
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "matscipy>=0.8",
]

# All optional dependencies
all = [
    "matscipy>=0.8",
    "juliacall>=0.9.20",
    "juliapkg>=0.1.10",
]

[project.urls]
Homepage = "https://github.com/ACEsuit/ACEpotentials.jl"
Documentation = "https://acesuit.github.io/ACEpotentials.jl"
Repository = "https://github.com/ACEsuit/ACEpotentials.jl"

[tool.hatch.build.targets.wheel]
# `packages` ships EVERY file under src/ase_ace, not only the .py files -- juliapkg.json and
# the whole src/ase_ace/julia/ project (Project.toml, ace_driver.jl, python_interface.jl)
# included.  That is why the Julia assets live inside the package: one
# `Path(__file__).parent`-relative expression then resolves in an editable install and in a
# wheel alike.  A `force-include` for juliapkg.json used to sit here; it was a no-op, since
# `packages` already carried it, and it is gone rather than left as a second mechanism doing
# the same job.  tests/test_packaging.py asserts the wheel's contents.
packages = ["src/ase_ace"]

# Manifest.toml is NOT shipped.  It is untracked in this repository (only Project.toml,
# ace_driver.jl and python_interface.jl are), so it is whatever the build machine's last
# `Pkg.instantiate()` happened to resolve -- shipping it would make the wheel's contents
# depend on who built it.  It also pins an exact dependency graph for one Julia version,
# inside a directory the installed user typically cannot edit, while the reproducibility this
# package actually promises is expressed in juliapkg.json ("julia": "=1.11.5", ACEpotentials
# 0.10).  Project.toml is enough: `Pkg.instantiate()` resolves it, and that is what
# ase_ace.utils.setup_julia_environment() runs.
exclude = ["src/ase_ace/julia/Manifest.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
